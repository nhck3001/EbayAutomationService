name: Fetch eBay Orders

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours
  workflow_dispatch:        # allows manual run

jobs:
  run-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0

      - name: Restore packages
        run: dotnet restore

      - name: Run FetchOrderWorker
        run: dotnet run --project EbayAutomationService.csproj -- fetchOrder
        env:
          CJ_API_KEY: ${{ secrets.CJ_API_KEY }}
          CJ_REFRESH_TOKEN: ${{ secrets.CJ_REFRESH_TOKEN }}
          APP_ID: ${{ secrets.APP_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
          DEVELOPER_ID: ${{ secrets.DEVELOPER_ID }}
          EBAY_AUTH_TOKEN: ${{ secrets.EBAY_AUTH_TOKEN }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          MERCHANT_LOCATION_KEY: ${{ secrets.MERCHANT_LOCATION_KEY }}
          FULFILLMENT_POLICY_ID: ${{ secrets.FULFILLMENT_POLICY_ID }}
          PAYMENT_POLICY: ${{ secrets.PAYMENT_POLICY }}
          RETURN_POLICY: ${{ secrets.RETURN_POLICY }}
          DATABASE_CONNECTION: ${{ secrets.DATABASE_CONNECTION }}

