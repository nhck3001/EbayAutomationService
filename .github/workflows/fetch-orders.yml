name: Fetch eBay Orders

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours
  workflow_dispatch:        # allows manual run

jobs:
  run-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0

      - name: Restore packages
        run: dotnet restore

      - name: Run FetchOrderWorker
        run: dotnet run --project EbayAutomationService.csproj -- fetchOrder