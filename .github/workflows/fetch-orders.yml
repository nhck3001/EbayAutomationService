name: Fetch eBay Orders

on:
  schedule:
    - cron: '0 */2 * * *'   # every 2 hours
  workflow_dispatch:        # allows manual run

jobs:
  run-worker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0

      - name: Restore packages
        run: dotnet restore

      - name: Run FetchOrderWorker
        run: dotnet run --project EbayAutomationService.csproj -- fetchOrder
        env:
          APP_ID: ${{ secrets.APP_ID }}
          CLIENT_SECRET: ${{ secrets.CLIENT_SECRET }}
          EBAY_REFRESH_TOKEN: ${{ secrets.EBAY_REFRESH_TOKEN }}
          CJ_REFRESH_TOKEN: ${{ secrets.CJ_REFRESH_TOKEN }}
          ConnectionStrings__DefaultConnection: ${{ secrets.DATABASE_CONNECTION }}